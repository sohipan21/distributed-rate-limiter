worker_processes auto;

events {
    # default is 512, which caps the cluster well below what the nodes can
    # serve — the proxy shows up as the bottleneck instead of the limiter
    worker_connections 8192;
}

http {
    access_log off;

    upstream nodes {
        server node1:8080;
        server node2:8080;
        server node3:8080;

        # without this nginx opens a fresh upstream connection per request and
        # spends the run in handshakes and TIME_WAIT
        keepalive 256;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://nodes;
            proxy_set_header Host $host;

            # upstream keepalive needs HTTP/1.1 and an empty Connection header;
            # the defaults (1.0 + "close") silently disable it
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
