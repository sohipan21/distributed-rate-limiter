# Redis HA topology: one master, one replica, three sentinels with quorum 2.
# Standalone rather than an override of docker-compose.yml, so the plain
# single-redis setup (and the kill-redis demo that drives it) stays untouched.
#
#   docker compose -f docker-compose.ha.yml up -d --wait
#   ./demo/failover.sh
#
# Nodes reach redis through the sentinels, so when the master dies they follow
# the promotion instead of pointing at a corpse.

x-sentinel: &sentinel
  image: redis:7-alpine
  # sentinel rewrites its own config at runtime, so it needs a writable copy
  # rather than a read-only mount. resolve-hostnames lets it monitor
  # "redis-master" instead of an IP that changes on every compose up.
  command: >
    sh -c 'printf "%s\n"
    "port 26379"
    "sentinel resolve-hostnames yes"
    "sentinel announce-hostnames yes"
    "sentinel monitor mymaster redis-master 6379 2"
    "sentinel down-after-milliseconds mymaster 1000"
    "sentinel failover-timeout mymaster 5000"
    "sentinel parallel-syncs mymaster 1"
    > /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf'
  depends_on:
    redis-master:
      condition: service_healthy
    redis-replica:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 2s
    timeout: 2s
    retries: 15

services:
  redis-master:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  sentinel1:
    <<: *sentinel
  sentinel2:
    <<: *sentinel
  sentinel3:
    <<: *sentinel

  node1: &node
    build: .
    command:
      - "-redis-sentinel"
      - "sentinel1:26379,sentinel2:26379,sentinel3:26379"
      - "-redis-master-name"
      - "mymaster"
      - "-degrade"
      - "open"
      - "-config"
      - "/etc/ratelimiter/config.yaml"
    volumes:
      - ./demo/config.failover.yaml:/etc/ratelimiter/config.yaml:ro
    depends_on:
      sentinel1:
        condition: service_healthy
      sentinel2:
        condition: service_healthy
      sentinel3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "8081:8080"
      - "9091:9090"

  node2:
    <<: *node
    ports:
      - "8082:8080"
      - "9092:9090"

  node3:
    <<: *node
    ports:
      - "8083:8080"
      - "9093:9090"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
